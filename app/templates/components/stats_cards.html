<section class="stats-stack row g-3" aria-label="Productivity statistics">
  <article class="col-6 col-xl-3">
    <div class="card stat-card h-100">
      <p class="eyebrow">Today</p>
      <p class="stat-hours" id="today-focus-hours">0.00 h</p>
      <p class="helper-text stat-hours-caption">Focus time today</p>
      <p class="stat-meta"><span id="today-focus-minutes">0 min</span><span id="today-date-label">-</span></p>
    </div>
  </article>

  <article class="col-6 col-xl-3">
    <div class="card stat-card h-100">
      <p class="eyebrow">This Week</p>
      <p class="stat-hours" id="week-focus-hours">0.00 h</p>
      <p class="helper-text stat-hours-caption">Focus time this week</p>
      <p class="stat-meta"><span id="week-focus-minutes">0 min</span><span id="week-date-label">-</span></p>
    </div>
  </article>

  <article class="col-6 col-xl-3">
    <div class="card stat-card h-100">
      <p class="eyebrow">This Month</p>
      <p class="stat-hours" id="month-focus-hours">0.00 h</p>
      <p class="helper-text stat-hours-caption">Focus time this month</p>
      <p class="stat-meta"><span id="month-focus-minutes">0 min</span><span id="month-date-label">-</span></p>
    </div>
  </article>

  <article class="col-6 col-xl-3">
    <div class="card stat-card h-100">
      <p class="eyebrow">Completed Pomodoros</p>
      <p class="stat-hours" id="today-work-sessions">0</p>
      <p class="helper-text stat-hours-caption">Completed work sessions today</p>
      <p class="stat-meta"><span>Work sessions</span><span>Today</span></p>
    </div>
  </article>
</section>
